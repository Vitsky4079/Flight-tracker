name: Check Prices

on:
  schedule:
    - cron: '*/30 * * * *'   # co 30 minut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check_prices.py
      - run: python portfolio.py
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json portfolio.json
          git diff --staged --quiet && echo "Brak zmian" && exit 0
          git commit -m "chore: aktualizacja danych $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main
          git push
