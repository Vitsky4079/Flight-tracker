<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Terminal — Portfel & Loty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette drawn from the Mustang "Blue Ember" iridescent paint */
  --bg:#08090f;
  --bg-2:#0b0d15;
  --surf:#10131e;
  --surf-2:#151926;
  --line:#1d2235;
  --line-2:#262c42;
  --txt:#e9ebf5;
  --txt-2:#9aa3bd;
  --muted:#576080;

  /* iridescent stops */
  --iri-1:#6f78ff;   /* indigo */
  --iri-2:#9b6fe6;   /* violet */
  --iri-3:#e08bb4;   /* rose */
  --iri-4:#e9a978;   /* copper */

  /* categorical (allocation) */
  --c-crypto:#7c83ff;
  --c-stocks:#5eead4;
  --c-metals:#e0b15e;
  --c-fixed:#e88bb4;

  --up:#46d98a;
  --down:#fb6f8a;

  --disp:'Sora',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--disp);
  background:
    radial-gradient(1100px 600px at 78% -8%, rgba(111,120,255,.10), transparent 60%),
    radial-gradient(900px 500px at 8% 108%, rgba(232,139,180,.07), transparent 55%),
    var(--bg);
  color:var(--txt);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}

.wrap{max-width:1080px;margin:0 auto;padding:1.5rem 1.25rem 4rem}

/* ── Top bar ─────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;flex-wrap:wrap;
  padding-bottom:1.1rem;margin-bottom:2rem;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .glyph{
  width:11px;height:11px;border-radius:3px;
  background:linear-gradient(135deg,var(--iri-1),var(--iri-3) 55%,var(--iri-4));
  box-shadow:0 0 16px -1px var(--iri-2);
  transform:rotate(45deg);
}
.brand .name{
  font-family:var(--mono);font-weight:800;font-size:.82rem;
  letter-spacing:.16em;text-transform:uppercase;
}
.brand .name .dim{color:var(--muted)}

.sync{
  display:flex;align-items:center;gap:.5rem;
  font-family:var(--mono);font-size:.68rem;color:var(--muted);
  letter-spacing:.06em;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--up);
  box-shadow:0 0 0 0 rgba(70,217,138,.6);
  animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,217,138,.5)}70%{box-shadow:0 0 0 7px rgba(70,217,138,0)}100%{box-shadow:0 0 0 0 rgba(70,217,138,0)}}

/* ── Tabs ────────────────────────────────────── */
.tabs{
  display:inline-flex;gap:.2rem;padding:.28rem;
  background:var(--surf);border:1px solid var(--line);border-radius:12px;
}
.tab{
  font-family:var(--mono);font-size:.74rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt-2);background:none;border:none;cursor:pointer;
  padding:.5rem .95rem;border-radius:9px;
  transition:color .2s,background .2s;
}
.tab:hover{color:var(--txt)}
.tab[aria-selected="true"]{
  color:#0a0b12;
  background:linear-gradient(120deg,var(--iri-1),var(--iri-3) 70%,var(--iri-4));
}

/* ── View toggling ───────────────────────────── */
.view{display:none}
.view.active{display:block;animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Hero (net worth) ────────────────────────── */
.hero{margin-bottom:1.6rem}
.eyebrow{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;
}
.networth{
  font-family:var(--mono);font-weight:800;
  font-size:clamp(2.9rem,9vw,5.4rem);line-height:.95;
  letter-spacing:-.04em;
  background:linear-gradient(100deg,var(--iri-1),var(--iri-2) 32%,var(--iri-3) 64%,var(--iri-4));
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shift 9s ease-in-out infinite;
}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.networth .cur{
  font-size:.32em;font-weight:700;letter-spacing:0;
  -webkit-text-fill-color:var(--txt-2);color:var(--txt-2);
  margin-left:.35rem;
}
.hero-sub{
  margin-top:.85rem;font-family:var(--mono);font-size:.72rem;
  color:var(--txt-2);letter-spacing:.04em;
}

/* ── Allocation bar ──────────────────────────── */
.alloc{margin-bottom:2rem}
.alloc-bar{
  display:flex;height:12px;border-radius:7px;overflow:hidden;
  background:var(--surf);border:1px solid var(--line);
}
.alloc-seg{height:100%;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.alloc-legend{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;
  margin-top:.9rem;
}
@media(max-width:560px){.alloc-legend{grid-template-columns:repeat(2,1fr)}}
.leg{
  display:flex;flex-direction:column;gap:.25rem;
  padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;
  background:var(--surf);
}
.leg-top{display:flex;align-items:center;gap:.4rem}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.leg-name{font-size:.7rem;color:var(--txt-2);letter-spacing:.02em}
.leg-pct{font-family:var(--mono);font-size:1rem;font-weight:700;letter-spacing:-.02em}
.leg-val{font-family:var(--mono);font-size:.64rem;color:var(--muted)}

/* ── Bento grid ──────────────────────────────── */
.bento{display:grid;grid-template-columns:1.15fr 1fr;gap:.9rem;align-items:start}
.bento-col{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.card{
  background:linear-gradient(180deg,var(--surf),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.35rem;
}
@media(max-width:820px){
  .bento{grid-template-columns:1fr}
}

.card-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.1rem;padding-bottom:.85rem;border-bottom:1px solid var(--line);
}
.card-title{display:flex;align-items:center;gap:.55rem}
.card-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.card-name{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-2)}
.card-total{font-family:var(--mono);font-size:1.18rem;font-weight:800;letter-spacing:-.025em}
.card-total .u{font-size:.62em;color:var(--muted);font-weight:500;margin-left:.18rem}

/* holdings rows */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  padding:.5rem 0;border-bottom:1px dashed var(--line);
}
.row:last-child{border-bottom:none}
.row-l{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.row-name{font-size:.86rem;font-weight:500}
.row-amt{font-family:var(--mono);font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;flex-shrink:0}
.row-val{font-family:var(--mono);font-size:.86rem;font-weight:700;letter-spacing:-.02em}
.chg{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.02em}
.chg.up{color:var(--up)}
.chg.down{color:var(--down)}

.row-note{font-size:.66rem;color:var(--muted);margin-top:.15rem;line-height:1.4}

/* ── Flights ─────────────────────────────────── */
.flights{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:680px){.flights{grid-template-columns:1fr}}
.fcard{
  background:linear-gradient(180deg,var(--surf),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:1.5rem;
  display:flex;flex-direction:column;gap:1.1rem;
  transition:border-color .4s,box-shadow .4s;
}
.fcard.alert{border-color:rgba(70,217,138,.4);box-shadow:0 0 40px -10px rgba(70,217,138,.4)}
.f-eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.f-route{font-family:var(--disp);font-size:1.1rem;font-weight:600;margin-top:.25rem}
.f-price-row{display:flex;align-items:baseline;gap:.4rem}
.f-price{font-family:var(--mono);font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.f-price.alert{
  background:linear-gradient(120deg,var(--up),var(--c-stocks));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.f-unit{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.badge{
  display:inline-flex;align-items:center;gap:.45rem;width:fit-content;
  font-family:var(--mono);font-size:.64rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem .7rem;border-radius:999px;
}
.badge.watch{background:rgba(87,96,128,.14);color:var(--txt-2);border:1px solid var(--line-2)}
.badge.hit{background:rgba(70,217,138,.08);color:var(--up);border:1px solid rgba(70,217,138,.35)}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.hit .bd{animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.f-divider{border:none;border-top:1px solid var(--line)}
.f-note{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.alert-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:.6rem .75rem;border-radius:9px;
  background:rgba(70,217,138,.07);border:1px solid rgba(70,217,138,.18);
  margin-bottom:.5rem;
}
.alert-date{font-family:var(--mono);font-size:.8rem;font-weight:700}
.alert-price{font-family:var(--mono);font-size:.78rem;color:var(--up);margin-top:.1rem}
.book{
  font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--iri-4);text-decoration:none;
  border:1px solid rgba(233,169,120,.35);padding:.3rem .65rem;border-radius:7px;
  white-space:nowrap;transition:background .15s;
}
.book:hover{background:rgba(233,169,120,.1)}
.f-link{
  margin-top:auto;font-family:var(--mono);font-size:.7rem;color:var(--iri-4);
  text-decoration:none;opacity:.85;transition:opacity .15s;
}
.f-link:hover{opacity:1;text-decoration:underline}

/* ── States ──────────────────────────────────── */
.state{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding:2.5rem 0}
.state.err{
  color:var(--down);background:rgba(251,111,138,.07);
  border:1px solid rgba(251,111,138,.2);border-radius:12px;
  padding:1.1rem 1.3rem;line-height:1.6;
}

/* ── Footer ──────────────────────────────────── */
.foot{
  margin-top:2.5rem;padding-top:1.1rem;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.04em;
}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--txt)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="glyph"></span>
      <span class="name">NET<span class="dim">.</span>WORTH<span class="dim">.TERMINAL</span></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" id="tab-loty" onclick="showView('loty')">Loty</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-portfel" onclick="showView('portfel')">Portfel</button>
    </div>
    <div class="sync"><span class="live-dot"></span><span id="sync-label">synchronizacja…</span></div>
  </div>

  <!-- ════ PORTFEL ════ -->
  <section class="view" id="view-portfel">
    <div class="hero">
      <div class="eyebrow">Wartość całkowita</div>
      <div class="networth"><span id="nw">—</span><span class="cur">zł</span></div>
      <div class="hero-sub" id="nw-sub">ładowanie pozycji…</div>
    </div>

    <div class="alloc">
      <div class="alloc-bar" id="alloc-bar"></div>
      <div class="alloc-legend" id="alloc-legend"></div>
    </div>

    <div class="bento" id="bento">
      <p class="state">Ładowanie portfela…</p>
    </div>
  </section>

  <!-- ════ LOTY ════ -->
  <section class="view active" id="view-loty">
    <div class="hero">
      <div class="eyebrow">Alert lotniczy · ≤ 500 zł · w jedną stronę · 1 osoba</div>
      <div class="networth" style="font-size:clamp(1.6rem,5vw,2.4rem)">GDN <span style="-webkit-text-fill-color:var(--iri-3);color:var(--iri-3);font-size:.85em">↔</span> Marsa Alam</div>
    </div>
    <div class="flights" id="flights"><p class="state">Ładowanie lotów…</p></div>
  </section>

  <div class="foot">
    <span id="foot-sync">—</span>
    <span>dane: CoinGecko · Stooq · gold-api · r.pl</span>
  </div>

</div>

<script>
/* ── helpers ─────────────────────────────────── */
const plMoney=(n,d=0)=>n.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDateTime=iso=>iso?new Date(iso).toLocaleString('pl-PL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Warsaw'}):'nigdy';
const fmtDate=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'});};
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const CAT=[
  {key:'Kryptowaluty',color:'var(--c-crypto)'},
  {key:'Akcje / ETF',color:'var(--c-stocks)'},
  {key:'Metale',color:'var(--c-metals)'},
  {key:'Nieruchomości i pojazdy',color:'var(--c-fixed)'},
];
const colorFor=name=>(CAT.find(c=>c.key===name)||{}).color||'var(--c-crypto)';

/* ── tabs ────────────────────────────────────── */
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('tab-portfel').setAttribute('aria-selected',v==='portfel');
  document.getElementById('tab-loty').setAttribute('aria-selected',v==='loty');
}

/* ── count-up ────────────────────────────────── */
function countUp(el,target){
  if(reduceMotion||target<=0){el.textContent=plMoney(target);return;}
  const dur=950,t0=performance.now();
  const ease=x=>1-Math.pow(1-x,3);
  function step(t){
    const p=Math.min((t-t0)/dur,1);
    el.textContent=plMoney(Math.round(target*ease(p)));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── render a holdings row ───────────────────── */
function holdingRow(item){
  const amt=item.amount!=null
    ? `${item.amount>=1?plMoney(item.amount,item.amount%1?2:0):item.amount} szt.`
    : '';
  const note=item.note?`<div class="row-amt">${item.note}</div>`:'';
  let chg='';
  if(item.change_24h!=null){
    const up=item.change_24h>=0;
    chg=`<span class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(item.change_24h).toFixed(1)}%</span>`;
  }
  return `<div class="row">
    <div class="row-l">
      <span class="row-name">${item.label}</span>
      ${item.note?note:(amt?`<span class="row-amt">${amt}</span>`:'')}
    </div>
    <div class="row-r">
      <span class="row-val">${plMoney(item.value_pln)} zł</span>
      ${chg}
    </div>
  </div>`;
}

/* ── portfolio ───────────────────────────────── */
async function loadPortfolio(){
  const bento=document.getElementById('bento');
  try{
    const res=await fetch('portfolio.json?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();

    countUp(document.getElementById('nw'),d.total_pln);
    const liquid=(d.groups||[]).filter(g=>g.name!=='Nieruchomości i pojazdy').reduce((s,g)=>s+g.total_pln,0);
    document.getElementById('nw-sub').textContent=
      `z czego płynne aktywa: ${plMoney(liquid)} zł · ${plMoney(d.total_pln-liquid)} zł w nieruchomościach i pojazdach`;

    /* allocation */
    const total=d.total_pln||1;
    const bar=document.getElementById('alloc-bar'),leg=document.getElementById('alloc-legend');
    bar.innerHTML='';leg.innerHTML='';
    CAT.forEach(c=>{
      const g=(d.groups||[]).find(x=>x.name===c.key);if(!g)return;
      const pct=g.total_pln/total*100;
      const seg=document.createElement('div');
      seg.className='alloc-seg';seg.style.background=c.color;
      seg.style.width='0%';bar.appendChild(seg);
      requestAnimationFrame(()=>{seg.style.width=pct+'%';});
      leg.insertAdjacentHTML('beforeend',
        `<div class="leg">
          <div class="leg-top"><span class="leg-dot" style="background:${c.color}"></span><span class="leg-name">${c.key}</span></div>
          <span class="leg-pct">${pct.toFixed(pct<10?1:0)}%</span>
          <span class="leg-val">${plMoney(g.total_pln)} zł</span>
        </div>`);
    });

    /* bento cards — crypto in left column, the rest stacked on the right */
    const cardHTML=g=>{
      const items=[...g.items].sort((a,b)=>b.value_pln-a.value_pln);
      return `<div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="card-dot" style="background:${colorFor(g.name)}"></span>
            <span class="card-name">${g.name}</span>
          </div>
          <span class="card-total">${plMoney(g.total_pln)}<span class="u">zł</span></span>
        </div>
        <div class="rows">${items.map(holdingRow).join('')}</div>
      </div>`;
    };
    const groups=d.groups||[];
    const crypto=groups.find(g=>g.name==='Kryptowaluty');
    const rest=groups.filter(g=>g.name!=='Kryptowaluty');
    bento.innerHTML=
      `<div class="bento-col">${crypto?cardHTML(crypto):''}</div>`+
      `<div class="bento-col">${rest.map(cardHTML).join('')}</div>`;

    const sync='zsynchronizowano '+fmtDateTime(d.last_checked);
    document.getElementById('sync-label').textContent=sync;
    document.getElementById('foot-sync').textContent=sync+' · co 30 min';

  }catch(err){
    bento.innerHTML=`<div class="state err"><strong>Nie można załadować portfolio.json</strong> — ${err.message}<br>Uruchom akcję <em>Check Prices</em> w zakładce Actions, aby wygenerować dane.</div>`;
    document.getElementById('nw').textContent='—';
    document.getElementById('nw-sub').textContent='brak danych';
  }
}

/* ── flights ─────────────────────────────────── */
function lotCount(n){if(n===1)return'1 lot';if(n>=2&&n<=4)return n+' loty';return n+' lotów';}
async function loadFlights(){
  const box=document.getElementById('flights');
  try{
    const res=await fetch('data.json?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(!d.routes||!d.routes.length){box.innerHTML='<p class="state">Brak danych o trasach.</p>';return;}
    box.innerHTML=d.routes.map(r=>{
      const hit=r.alerts&&r.alerts.length>0;
      const price=r.cheapest_price!=null?plMoney(r.cheapest_price):'—';
      const rows=hit
        ?r.alerts.map(f=>`<div class="alert-row"><div><div class="alert-date">${fmtDate(f.date)}</div><div class="alert-price">${plMoney(f.price)} zł</div></div><a class="book" href="${r.url}" target="_blank" rel="noopener">Rezerwuj ↗</a></div>`).join('')
        :(r.cheapest_date?`<p class="f-note">Najtańszy: ${fmtDate(r.cheapest_date)}</p>`:'');
      return `<div class="fcard ${hit?'alert':''}">
        <div><div class="f-eyebrow">w jedną stronę · 1 osoba</div><div class="f-route">${r.name}</div></div>
        <div class="f-price-row"><span class="f-price ${hit?'alert':''}">${price}</span><span class="f-unit">zł/os.</span></div>
        <span class="badge ${hit?'hit':'watch'}"><span class="bd"></span>${hit?('Alert — '+lotCount(r.alerts.length)):'Obserwuję'}</span>
        <hr class="f-divider">
        ${rows}
        <a class="f-link" href="${r.url}" target="_blank" rel="noopener">Wszystkie loty na r.pl ↗</a>
      </div>`;
    }).join('');
  }catch(err){
    box.innerHTML=`<div class="state err"><strong>Nie można załadować data.json</strong> — ${err.message}</div>`;
  }
}

loadPortfolio();
loadFlights();
